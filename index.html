<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Справочник форм автомобилей</title>
<style>
/* ===== Шаг 2-3. Стили ===== */
* { box-sizing: border-box; }
:root {
  --bg:#f5f7fb; --card:#fff; --ink:#1b2130; --muted:#667085;
  --line:#e5e9f0; --accent:#2f5bea; --accent-soft:#e8eeff;
  --danger:#d92d20; --danger-soft:#fdecea; --ok:#12b76a;
  --radius:14px;
  --shadow:0 6px 24px rgba(20,30,60,.06);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column;}
#app{flex:1;padding-top:28px;padding-bottom:48px;}
.container{width:100%;max-width:1180px;margin:0 auto;padding:0 20px;}
h1{font-size:28px;margin:0 0 6px;}
h2{font-size:20px;margin:26px 0 12px;}
h3{margin:0 0 6px;font-size:17px;}
p{margin:8px 0;}
.site-header{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
.header-inner{display:flex;align-items:center;justify-content:space-between;height:62px;}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px;color:var(--ink);text-decoration:none;}
.site-header nav{display:flex;gap:6px;}
.site-header nav a{padding:8px 14px;border-radius:10px;text-decoration:none;color:var(--muted);font-weight:600;font-size:14.5px;transition:.15s;}
.site-header nav a:hover,.site-header nav a.active{color:var(--accent);background:var(--accent-soft);}
.site-footer{border-top:1px solid var(--line);padding:18px 0;color:var(--muted);font-size:14px;background:#fff;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:10px;font-size:14.5px;font-weight:600;text-decoration:none;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);transition:.15s;font-family:inherit;}
.btn:hover{border-color:#cfd6e4;background:#fafbff;}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn.primary:hover{background:#2448c8;}
.btn.danger{color:var(--danger);border-color:#f3c3be;}
.btn.danger:hover{background:var(--danger-soft);}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px;}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:7px;background:var(--accent-soft);color:var(--accent);text-transform:uppercase;letter-spacing:.3px;}
.page-head{margin-bottom:24px;}
.page-head p{color:var(--muted);margin:4px 0 0;}
.toolbar{display:flex;gap:12px;margin-bottom:22px;}
.toolbar input,.toolbar select{flex:1;padding:11px 14px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff;color:var(--ink);}
.toolbar input:focus,.toolbar select:focus{outline:2px solid var(--accent-soft);border-color:var(--accent);}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px;}
.card{display:flex;flex-direction:column;background:var(--card);border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow);text-decoration:none;color:inherit;transition:.2s;}
.card:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(20,30,60,.1);}
.card-img{aspect-ratio:16/10;background:#eef1f8;overflow:hidden;}
.card-img img{width:100%;height:100%;object-fit:cover;display:block;}
.card-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1;}
.card-body p{color:var(--muted);font-size:14px;margin:0;flex:1;}
.card-foot{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px;margin-top:8px;}
.more{color:var(--accent);font-weight:600;}
.pagination{display:flex;gap:8px;justify-content:center;margin-top:26px;}
.pg{min-width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:pointer;font:inherit;font-weight:600;color:var(--ink);transition:.15s;}
.pg:hover:not(:disabled){border-color:var(--accent);color:var(--accent);}
.pg.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.pg:disabled{opacity:.4;cursor:default;}
.pg-dots{align-self:center;color:var(--muted);}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:var(--radius);padding:48px 24px;text-align:center;color:var(--muted);}
.back-link{display:inline-block;margin-bottom:16px;color:var(--muted);text-decoration:none;font-size:14px;}
.back-link:hover{color:var(--accent);}
.form-view-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:30px;align-items:start;}
.gallery{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);}
.main-img{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:10px;display:block;background:#eef1f8;}
.thumbs{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;}
.thumb{width:86px;height:60px;padding:0;border:2px solid var(--line);border-radius:8px;overflow:hidden;cursor:pointer;background:none;transition:.15s;}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.thumb.active{border-color:var(--accent);}
.form-info{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);}
.lead{color:var(--muted);font-size:15.5px;}
.form-stats{display:flex;gap:18px;color:var(--muted);font-size:13.5px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px 0;margin:14px 0;}
.desc{white-space:pre-line;font-size:15px;}
.admin-layout{display:grid;grid-template-columns:220px 1fr;gap:28px;align-items:start;}
.admin-nav{position:sticky;top:86px;display:flex;flex-direction:column;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:10px;box-shadow:var(--shadow);}
.admin-nav a{padding:9px 12px;border-radius:9px;text-decoration:none;color:var(--muted);font-weight:600;font-size:14.5px;transition:.15s;}
.admin-nav a:hover{background:var(--accent-soft);color:var(--accent);}
.admin-nav a.active{background:var(--accent-soft);color:var(--accent);}
.admin-nav a.logout{color:var(--danger);margin-top:8px;border-top:1px solid var(--line);padding-top:12px;}
.admin-nav a.logout:hover{background:var(--danger-soft);}
.admin-content{min-width:0;}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:18px 0 6px;}
.stat-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);}
.stat-card .k{font-size:13px;color:var(--muted);font-weight:600;}
.stat-card .v{font-size:30px;font-weight:800;margin-top:4px;}
.table-wrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:18px;}
table{width:100%;border-collapse:collapse;font-size:14.5px;}
th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle;}
th{font-size:12.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);}
tr:last-child td{border-bottom:none;}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;}
.field label{font-size:13.5px;font-weight:600;}
.field input,.field select,.field textarea{padding:10px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff;color:var(--ink);}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent);}
.form-grid{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);max-width:640px;}
.form-actions{display:flex;gap:10px;margin-top:6px;}
.hint{font-size:14px;color:var(--muted);}
.previews{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;}
.img-prev{position:relative;width:110px;height:80px;border-radius:8px;overflow:hidden;border:1px solid var(--line);}
.img-prev img{width:100%;height:100%;object-fit:cover;display:block;}
.img-prev .x{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;border:none;background:rgba(20,30,60,.75);color:#fff;cursor:pointer;font-size:13px;line-height:1;}
.img-prev .x:hover{background:var(--danger);}
.auth-wrap{display:flex;justify-content:center;padding-top:40px;}
.auth-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:28px;width:100%;max-width:380px;box-shadow:var(--shadow);}
.err{color:var(--danger);font-weight:600;font-size:14px;min-height:20px;margin:10px 0 0;}
.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;transition:.3s;z-index:1000;max-width:90vw;}
.toast.show{opacity:1;transform:translate(-50%,0);}
.toast.info{background:var(--ink);}
.toast.success{background:var(--ok);}
.toast.error{background:var(--danger);}
@media (max-width:900px){
  .form-view-grid,.admin-layout{grid-template-columns:1fr;}
  .admin-nav{position:static;flex-direction:row;overflow-x:auto;}
  .admin-nav a.logout{margin-top:0;border-top:none;padding-top:9px;}
  .stats-grid{grid-template-columns:1fr;}
}
@media (max-width:560px){
  .toolbar{flex-direction:column;}
  .toolbar input,.toolbar select{width:100%;}
}
</style>
</head>
<body>
<header class="site-header">
  <div class="container header-inner">
    <a href="#/" class="logo">🚗 <span>Формы авто</span></a>
    <nav>
      <a href="#/" id="nav-home">Каталог</a>
      <a href="#/admin" id="nav-admin">Админ-панель</a>
    </nav>
  </div>
</header>
<main id="app" class="container">
  <div class="empty"><h2>Загрузка…</h2></div>
</main>
<footer class="site-footer">
  <div class="container"><p>Учебный проект · HTML / CSS / JS · localStorage</p></div>
</footer>
<script>
/* ===== Шаг 4. Константы и утилиты ===== */
const K = {
  forms: 'cf_forms',
  cats: 'cf_categories',
  nextId: 'cf_nextId',
  admin: 'cf_admin',
  initialized: 'cf_initialized'
};
const ADMIN_DEFAULT = { login: 'admin', password: 'admin123' };
const PER_PAGE = 6;
const app = document.getElementById('app');

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  }[c]));
}

function toast(msg, type = 'info') {
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  document.body.appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  setTimeout(() => {
    el.classList.remove('show');
    setTimeout(() => el.remove(), 300);
  }, 2600);
}

function now() {
  return new Date().toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric' });
}

function ph(text, color) {
  color = color || '#2f5bea';
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500">
    <rect width="800" height="500" fill="${color}"/>
    <text x="400" y="260" fill="#fff" font-family="Arial" font-size="52" font-weight="bold" text-anchor="middle">${esc(text)}</text>
  </svg>`;
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}

async function hashPassword(pwd) {
  try {
    if (window.crypto && crypto.subtle && crypto.subtle.digest) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pwd));
      return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
    }
  } catch (e) {}
  /* Fallback: собственная простая реализация (для file://) */
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (let i = 0; i < pwd.length; i++) {
    const ch = pwd.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761);
    h2 = Math.imul(h2 ^ ch, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return 'fb' + (h2 >>> 0).toString(16) + (h1 >>> 0).toString(16);
}

function readFileAsDataURL(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = () => reject(r.error);
    r.readAsDataURL(file);
  });
}

function validateImage(file) {
  const ok = ['image/jpeg', 'image/png', 'image/webp'];
  if (!ok.includes(file.type)) return 'Недопустимый формат.';
  if (file.size > 500 * 1024) return 'Файл больше 500 КБ.';
  return null;
}

/* ===== Шаг 5. Хранение данных ===== */
function getForms() {
  try { return JSON.parse(localStorage.getItem(K.forms) || '[]'); }
  catch (e) { return []; }
}
function setForms(arr) {
  try { localStorage.setItem(K.forms, JSON.stringify(arr)); }
  catch (e) {
    toast('Превышен лимит хранилища. Удалите часть изображений.', 'error');
    throw e;
  }
}
function getCats() {
  try { return JSON.parse(localStorage.getItem(K.cats) || '[]'); }
  catch (e) { return []; }
}
function setCats(arr) {
  try { localStorage.setItem(K.cats, JSON.stringify(arr)); }
  catch (e) { toast('Ошибка сохранения', 'error'); }
}
function nextId() {
  const n = +(localStorage.getItem(K.nextId) || '1');
  localStorage.setItem(K.nextId, n + 1);
  return n;
}
function isAuthed() { return sessionStorage.getItem(K.admin) === '1'; }
function requireAuth() {
  if (!isAuthed()) { location.hash = '#/admin/login'; return false; }
  return true;
}

/* ===== Шаг 6. Инициализация и демо-данные ===== */
const SEED = [
  { title: 'Седан', category: 'Легковые', short: 'Классический трёхобъёмный кузов с отдельным багажником',
    desc: 'Седан — самый распространённый тип легкового кузова. салон и багажник разделены, крыша не продолжается за заднее стекло.\nПлюсы: тишина в салоне, презентабельный вид, комфортная подвеска.\nМинусы: небольшой проём багажника, хуже маневренность на парковке.\nПримеры: Toyota Camry, Hyundai Sonata, Kia K5.', color: '#2f5bea' },
  { title: 'Хэтчбек', category: 'Легковые', short: 'Компактный кузов с дверью в задней стене',
    desc: 'Хэтчбек — короткий кузов, где багажник объединён с салоном и открывается вместе со стеклом.\nПлюсы: компактность, удобная парковка, большой проём багажника.\nМинусы: меньше багажника, шум от дороги при сложенной спинке.\nПримеры: Volkswagen Golf, Kia Rio, Renault Clio.', color: '#12b76a' },
  { title: 'Универсал', category: 'Легковые', short: 'Удлинённая крыша и большой багажник',
    desc: 'Универсал сочетает комфорт седана с грузовым объёмом хэтчбека: крыша продолжается до заднего бампера.\nПлюсы: огромный багажник, плоский пол при сложенных сиденьях.\nМинусы: длинный задний свес, сниженная маневренность.\nПримеры: Skoda Octavia Combi, Volvo V60, Ford Mondeo Wagon.', color: '#f79009' },
  { title: 'Купе', category: 'Легковые', short: 'Двухдверный кузов с покатой крышей',
    desc: 'Купе — спортивный силуэт: две двери, низкая крыша, покатое заднее стекло.\nПлюсы: эффектный дизайн, жёсткий кузов, азартная управляемость.\nМинусы: тесный задний ряд, неудобная посадка.\nПримеры: BMW 4 Series, Ford Mustang, Audi A5.', color: '#7a5af8' },
  { title: 'Внедорожник (SUV)', category: 'Внедорожники', short: 'Высокий кузов, полный привод, большие колёса',
    desc: 'Внедорожник (SUV) отличается высоким дорожным просветом, большой площадью остекления и, часто, полным приводом.\nПлюсы: высокая посадка, простор, уверенность на грунтовых дорогах.\nМинусы: выше расход топлива и центр тяжести.\nПримеры: Toyota RAV4, Hyundai Tucson, Jeep Wrangler.', color: '#d92d20' },
  { title: 'Пикап', category: 'Грузовые', short: 'Кабина плюс открытая грузовая платформа',
    desc: 'Пикап — грузовая платформа сзади и кабина спереди. Популярен там, где нужен и транспорт, и «рабочая лошадка».\nПлюсы: большая грузоподъёмность, тяга, проходимость.\nМинусы: габариты, расход топлива, неудобная парковка.\nПримеры: Ford F-150, Toyota Hilux, УАЗ Пикап.', color: '#475467' }
];

async function init() {
  if (!localStorage.getItem(K.initialized)) {
    setCats(['Легковые', 'Внедорожники', 'Грузовые']);

    const forms = SEED.map((s, i) => ({
      id: i + 1,
      title: s.title,
      category: s.category,
      short_description: s.short,
      description: s.desc,
      main_image: ph(s.title, s.color),
      images: [ph(s.title + ' — вид 1', s.color), ph(s.title + ' — вид 2', s.color)],
      views: Math.floor(Math.random() * 40) + 3,
      created_at: now(),
      updated_at: now()
    }));
    setForms(forms);
    localStorage.setItem(K.nextId, forms.length + 1);

    const adminHash = await hashPassword(ADMIN_DEFAULT.password);
    localStorage.setItem(K.admin, JSON.stringify({ login: ADMIN_DEFAULT.login, hash: adminHash }));
    localStorage.setItem(K.initialized, '1');
  }
  route();
}

/* ===== Шаг 7. Роутер на hash ===== */
function route() {
  const hash = location.hash.slice(1) || '/';
  const parts = hash.split('/').filter(Boolean);

  document.querySelectorAll('.site-header nav a').forEach(a => a.classList.remove('active'));
  if (parts[0] === 'admin') document.getElementById('nav-admin').classList.add('active');
  else document.getElementById('nav-home').classList.add('active');

  window.scrollTo(0, 0);

  if (parts[0] === 'form' && parts[1]) { renderForm(+parts[1]); return; }

  if (parts[0] === 'admin') {
    if (parts[1] === 'login') { renderAdminLogin(); return; }
    if (parts[1] === 'logout') {
      sessionStorage.removeItem(K.admin);
      toast('Вы вышли', 'success');
      location.hash = '#/';
      return;
    }
    if (!requireAuth()) return;
    if (parts[1] === 'forms') { renderAdminForms(); return; }
    if (parts[1] === 'categories') { renderAdminCategories(); return; }
    if (parts[1] === 'form' && parts[2] === 'add') { renderAdminForm(null); return; }
    if (parts[1] === 'form' && parts[2] === 'edit') { renderAdminForm(+parts[3]); return; }
    renderAdminDashboard();
    return;
  }

  renderHome();
}

/* ===== Шаг 8. Каталог ===== */
let state = { q: '', cat: '', page: 1 };

function renderHome() {
  state = { q: '', cat: '', page: 1 };
  app.innerHTML = `
    <div class="page-head">
      <h1>Справочник форм автомобилей</h1>
      <p>Типы кузова: описание, характеристики, фотографии</p>
    </div>
    <div class="toolbar">
      <input type="search" id="q" placeholder="🔍 Поиск по названию…">
      <select id="catSel"></select>
    </div>
    <div id="results"></div>
  `;

  document.getElementById('catSel').innerHTML =
    `<option value="">Все категории</option>` +
    getCats().map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join('');

  document.getElementById('q').addEventListener('input', e => {
    state.q = e.target.value; state.page = 1; renderHomeList();
  });
  document.getElementById('catSel').addEventListener('change', e => {
    state.cat = e.target.value; state.page = 1; renderHomeList();
  });
  document.getElementById('results').addEventListener('click', e => {
    const btn = e.target.closest('[data-page]');
    if (!btn || btn.disabled) return;
    state.page = +btn.dataset.page;
    renderHomeList();
    document.getElementById('results').scrollIntoView({ behavior: 'smooth' });
  });

  renderHomeList();
}

function renderHomeList() {
  const q = state.q.trim().toLowerCase();
  const cat = state.cat;

  const filtered = getForms().filter(f => {
    const matchQ = !q || (f.title || '').toLowerCase().includes(q);
    const matchC = !cat || f.category === cat;
    return matchQ && matchC;
  }).sort((a, b) => b.id - a.id);

  const totalPages = Math.max(1, Math.ceil(filtered.length / PER_PAGE));
  if (state.page > totalPages) state.page = totalPages;
  const start = (state.page - 1) * PER_PAGE;
  const pageItems = filtered.slice(start, start + PER_PAGE);

  const results = document.getElementById('results');
  if (!pageItems.length) {
    results.innerHTML = `<div class="empty">
      <h2>Ничего не найдено</h2>
      <p>Попробуйте изменить запрос или категорию.</p>
    </div>`;
    return;
  }

  let html = '<div class="grid">';
  for (const f of pageItems) {
    html += `
      <a class="card" href="#/form/${f.id}">
        <div class="card-img"><img src="${f.main_image || ph('Нет фото')}" alt="${esc(f.title)}"></div>
        <div class="card-body">
          <span class="tag">${esc(f.category)}</span>
          <h3>${esc(f.title)}</h3>
          <p>${esc(f.short_description || '')}</p>
          <div class="card-foot">
            <span>👁 ${f.views || 0} просмотров</span>
            <span class="more">Подробнее →</span>
          </div>
        </div>
      </a>`;
  }
  html += '</div>' + paginationHtml(totalPages, state.page);
  results.innerHTML = html;
}

function paginationHtml(total, current) {
  if (total <= 1) return '';
  let html = '<div class="pagination">';
  html += `<button class="pg" data-page="${current - 1}" ${current === 1 ? 'disabled' : ''}>←</button>`;
  let last = 0;
  for (let i = 1; i <= total; i++) {
    if (i === 1 || i === total || Math.abs(i - current) <= 2) {
      if (i - last > 1) html += '<span class="pg-dots">…</span>';
      html += `<button class="pg ${i === current ? 'active' : ''}" data-page="${i}">${i}</button>`;
      last = i;
    }
  }
  html += `<button class="pg" data-page="${current + 1}" ${current === total ? 'disabled' : ''}>→</button>`;
  return html + '</div>';
}

/* ===== Шаг 9. Страница просмотра ===== */

/* ===== Шаг 10. Авторизация ===== */
function renderAdminLogin() {
  app.innerHTML = `
    <div class="auth-wrap">
      <form class="auth-card" id="loginForm">
        <h2>Вход в админ-панель</h2>
        <p class="hint">По умолчанию: <b>admin</b> / <b>admin123</b></p>
        <div class="field">
          <label>Логин</label>
          <input name="login" required autofocus>
        </div>
        <div class="field">
          <label>Пароль</label>
          <input name="password" type="password" required>
        </div>
        <button class="btn primary" type="submit">Войти</button>
        <p class="err" id="err"></p>
      </form>
    </div>`;

  document.getElementById('loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const login = (fd.get('login') || '').toString().trim();
    const password = (fd.get('password') || '').toString();
    const err = document.getElementById('err');
    err.textContent = '';

    const admin = JSON.parse(localStorage.getItem(K.admin) || 'null');
    if (!admin) { err.textContent = 'Администратор не настроен.'; return; }

    const hash = await hashPassword(password);
    if (login === admin.login && hash === admin.hash) {
      sessionStorage.setItem(K.admin, '1');
      toast('Добро пожаловать!', 'success');
      location.hash = '#/admin';
    } else {
      err.textContent = 'Неверный логин или пароль';
    }
  });
}

}

/* ===== Шаг 13. Форма добавления и редактирования ===== */
function renderAdminForm(id) {
  const isEdit = id != null;
  const existing = isEdit ? getForms().find(f => f.id === id) : null;

  if (isEdit && !existing) {
    app.innerHTML = adminShell('<div class="empty"><h2>Запись не найдена</h2></div>', 'forms');
    return;
  }

  const cats = getCats();
  if (!cats.length) {
    app.innerHTML = adminShell(`
      <h1>${isEdit ? 'Редактирование' : 'Новая запись'}</h1>
      <div class="empty">
        <h2>Сначала создайте категорию</h2>
        <p>Без категории запись сохранить нельзя.</p>
        <p style="margin-top:12px"><a href="#/admin/categories" class="btn primary">Перейти к категориям</a></p>
      </div>`, 'forms');
    return;
  }

  let mainImage = existing ? existing.main_image : null;
  let gallery = existing ? [...(existing.images || [])] : [];

  const content = `
    <h1>${isEdit ? 'Редактирование' : 'Новая запись'}</h1>
    <form class="form-grid" id="form">
      <div class="field">
        <label>Название *</label>
        <input name="title" required value="${existing ? esc(existing.title) : ''}">
      </div>
      <div class="field">
        <label>Категория *</label>
        <select name="category" required>
          ${cats.map(c => `<option value="${esc(c)}"
            ${existing && existing.category === c ? 'selected' : ''}>${esc(c)}</option>`).join('')}
        </select>
      </div>
      <div class="field">
        <label>Краткое описание</label>
        <textarea name="short_description" rows="2">${existing ? esc(existing.short_description || '') : ''}</textarea>
      </div>
      <div class="field">
        <label>Полное описание</label>
        <textarea name="description" rows="7">${existing ? esc(existing.description || '') : ''}</textarea>
      </div>
      <div class="field">
        <label>Главное изображение (jpg, png, webp · до 500 КБ)</label>
        <input type="file" name="mainFile" accept="image/jpeg,image/png,image/webp">
        <div id="mainPreview"></div>
      </div>
      <div class="field">
        <label>Галерея (можно несколько файлов)</label>
        <input type="file" name="galleryFiles" accept="image/jpeg,image/png,image/webp" multiple>
        <div class="previews" id="galleryPreview"></div>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn primary">${isEdit ? 'Сохранить' : 'Добавить'}</button>
        <a href="#/admin/forms" class="btn">Отмена</a>
      </div>
    </form>`;

  app.innerHTML = adminShell(content, 'forms');

  function renderMainPreview() {
    const mp = document.getElementById('mainPreview');
    mp.innerHTML = mainImage
      ? `<div class="img-prev">
          <img src="${mainImage}">
          <button type="button" class="x" data-rm-main>×</button>
        </div>`
      : '<p class="hint">Не выбрано</p>';
    const rm = mp.querySelector('[data-rm-main]');
    if (rm) rm.onclick = () => { mainImage = null; renderMainPreview(); };
  }

  function renderGalleryPreview() {
    const gp = document.getElementById('galleryPreview');
    gp.innerHTML = gallery.map((src, i) =>
      `<div class="img-prev">
        <img src="${src}">
        <button type="button" class="x" data-rm-g="${i}">×</button>
      </div>`
    ).join('');
    gp.querySelectorAll('[data-rm-g]').forEach(btn => {
      btn.onclick = () => { gallery.splice(+btn.dataset.rmG, 1); renderGalleryPreview(); };
    });
  }

  renderMainPreview();
  renderGalleryPreview();

  document.querySelector('[name="mainFile"]').addEventListener('change', async e => {
    const file = e.target.files[0];
    if (!file) return;
    const err = validateImage(file);
    if (err) { toast(err, 'error'); e.target.value = ''; return; }
    mainImage = await readFileAsDataURL(file);
    renderMainPreview();
  });

  document.querySelector('[name="galleryFiles"]').addEventListener('change', async e => {
    for (const file of [...e.target.files]) {
      const err = validateImage(file);
      if (err) { toast(`${file.name}: ${err}`, 'error'); continue; }
      gallery.push(await readFileAsDataURL(file));
    }
    e.target.value = '';
    renderGalleryPreview();
  });

  document.getElementById('form').addEventListener('submit', e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const data = {
      title: fd.get('title').toString().trim(),
      category: fd.get('category').toString(),
      short_description: fd.get('short_description').toString().trim(),
      description: fd.get('description').toString().trim()
    };
    if (!data.title) { toast('Введите название', 'error'); return; }

    const forms = getForms();
    if (isEdit) {
      const i = forms.findIndex(f => f.id === id);
      forms[i] = { ...forms[i], ...data, main_image: mainImage, images: gallery, updated_at: now() };
    } else {
      forms.push({
        id: nextId(),
        ...data,
        main_image: mainImage,
        images: gallery,
        views: 0,
        created_at: now(),
        updated_at: now()
      });
    }
    setForms(forms);
    toast(isEdit ? 'Сохранено' : 'Добавлено', 'success');
    location.hash = '#/admin/forms';
  });
}

/* ===== Шаг 14. Категории ===== */
function renderAdminCategories() {
  const cats = getCats();
  const forms = getForms();

  const content = `
    <h1>Категории</h1>
    <form id="addCat" style="display:flex;gap:10px;margin-bottom:18px;">
      <input name="name" placeholder="Название категории" required style="padding:10px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;flex:1;max-width:320px;">
      <button class="btn primary" type="submit">Добавить</button>
    </form>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Название</th><th>Записей</th><th>Действия</th></tr></thead>
        <tbody>
          ${cats.map(c => {
            const count = forms.filter(f => f.category === c).length;
            return `
            <tr>
              <td><b>${esc(c)}</b></td>
              <td>${count}</td>
              <td>
                <button class="btn sm" data-rename="${esc(c)}">✎ Переименовать</button>
                <button class="btn sm danger" data-rmcat="${esc(c)}">🗑</button>
              </td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>`;

  app.innerHTML = adminShell(content, 'cats');

  document.getElementById('addCat').addEventListener('submit', e => {
    e.preventDefault();
    const name = e.target.querySelector('[name="name"]').value.trim();
    if (!name) return;
    const list = getCats();
    if (list.includes(name)) { toast('Такая категория уже есть', 'error'); return; }
    list.push(name);
    setCats(list);
    toast('Категория добавлена', 'success');
    renderAdminCategories();
  });

  app.querySelectorAll('[data-rename]').forEach(btn => {
    btn.addEventListener('click', () => {
      const oldName = btn.dataset.rename;
      const newName = prompt('Новое название:', oldName);
      if (!newName || newName.trim() === oldName) return;
      const trimmed = newName.trim();

      setCats(getCats().map(c => c === oldName ? trimmed : c));
      setForms(getForms().map(f => f.category === oldName ? { ...f, category: trimmed } : f));
      toast('Категория переименована', 'success');
      renderAdminCategories();
    });
  });

  app.querySelectorAll('[data-rmcat]').forEach(btn => {
    btn.addEventListener('click', () => {
      const name = btn.dataset.rmcat;
      const count = getForms().filter(f => f.category === name).length;
      if (count > 0) {
        toast(`Нельзя удалить: в категории ${count} записей`, 'error');
        return;
      }
      if (!confirm(`Удалить «${name}»?`)) return;
      setCats(getCats().filter(c => c !== name));
      toast('Категория удалена', 'success');
      renderAdminCategories();
    });
  });
}
